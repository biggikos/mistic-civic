##############################################################################
##                         MysticChest  -  config.yml                         ##
##############################################################################
## HOW TO READ THIS FILE
##   "## text"  = explanation / tutorial for the setting right below it.
##   "# key: v" = an optional example. Remove the leading "# " to enable it.
##   Seconds are real seconds. 0 means "off" for cooldowns and limits.
##   After editing run  /mystic reload  (no restart needed).
##   Tiers (prices, names, per-tier overrides) live in tiers.yml,
##   rewards live in loot/<tier>.yml, texts live in lang/*.yml.
##############################################################################

## ═══ LANGUAGE ═══════════════════════════════════════════════════════════════
## Language of all messages and GUIs.
##   en   - English (default)
##   ru   - Russian
##   auto - use each player's client language (falls back to en)
## You can add your own file lang/<code>.yml and write its code here.
language: en

## Used to upgrade this file when the plugin updates. Do not change it.
config-version: 7

## Extra console output for troubleshooting.
debug: false

## ═══ HOW REWARDS ARE GIVEN ══════════════════════════════════════════════════
## Default way to open a chest (every tier can override it with "open-mode"):
##   ROULETTE   - animated spin, the prize lands in the middle (see "roulette")
##   FULL_CHEST - a chest GUI full of loot, the player takes what they want
##   INSTANT    - everything goes straight to the inventory, no GUI
##   PICK       - mystery cards: pick N face-down cards (see "pick")
##   RANDOM     - a random one of the above every time (see "random-mode")
default-open-mode: ROULETTE

## What a right click with the chest item does.
##   click-air:   OPEN | NONE
##   click-block: PLACE (put the chest in the world, players open it there)
##                OPEN  (open immediately) | NONE
## Recipe "classic FunTime":  click-air: NONE  /  click-block: PLACE
use:
  click-air: OPEN
  click-block: PLACE

## ═══ ECONOMY ════════════════════════════════════════════════════════════════
## Default economy for tiers:
##   AUTO              - first installed of ExcellentEconomy, CoinsEngine, Vault, PlayerPoints (default)
##   VAULT             - Vault / VaultUnlocked and any economy plugin behind it (single currency)
##   EXCELLENT_ECONOMY - multi-currency (gold, tokens ...), needs PlaceholderAPI
##   COINS_ENGINE      - multi-currency, needs PlaceholderAPI (preset NOT verified on a live server)
##   PLAYER_POINTS     - PlayerPoints (one integer currency, ideal for donate "tokens")
##   NONE              - shop purchases are disabled, give chests with /mystic give
## A tier can pick its own economy in tiers.yml with  currency: "provider:currency"
##   currency: gold                       -> default provider, currency "gold"
##   currency: "excellenteconomy:coins"   -> ExcellentEconomy, currency "coins"
##   currency: playerpoints               -> PlayerPoints (no currency name needed)
##   currency: vault                      -> Vault
## So "gold" can come from Vault while "tokens" come from PlayerPoints.
## Check what the plugin sees with  /mystic economy  (and  /mystic economy <currency>  for your balance).
economy:
  provider: AUTO
  excellent-economy:
    ## Placeholder that returns the raw balance. {currency} = the currency id.
    balance-placeholder: "%excellenteconomy_balance_raw_{currency}%"
    ## Console commands used to charge / refund. ExcellentEconomy 2.8 registers one command per
    ## currency (the currency id is its command), e.g. "money take Steve 100". Verified on 2.8.0.
    take-command: "{currency} take {player} {amount}"
    give-command: "{currency} give {player} {amount}"
  coins-engine:
    ## Unverified preset - check the names against your CoinsEngine version and edit if needed.
    balance-placeholder: "%coinsengine_balance_raw_{currency}%"
    take-command: "coinsengine take {player} {currency} {amount}"
    give-command: "coinsengine give {player} {currency} {amount}"

## ═══ COOLDOWNS ══════════════════════════════════════════════════════════════
## Every value can be overridden per tier in tiers.yml (cooldowns: section).
## Players with  mysticchest.bypass.cooldown  ignore all of these.
cooldowns:
  ## Who shares an "open" cooldown:
  ##   PLAYER      - one cooldown for any chest the player opens
  ##   PLAYER_TIER - separate cooldown per tier (default)
  ##   GLOBAL      - everybody shares the cooldown of a tier (one player opening "poor" blocks "poor" for all)
  scope: PLAYER_TIER
  ## Seconds between two chest openings.  e.g. 3600 = once per hour.
  open-seconds: 0
  ## Seconds between two shop purchases.
  buy-seconds: 0
  ## Chest placed by a player: only they can open it for this many seconds.
  claim-seconds: 0
  ## Minimum seconds between two automatic spawns on the whole server.
  spawn-seconds: 600

## ═══ LIMITS ═════════════════════════════════════════════════════════════════
## Players with  mysticchest.bypass.limits  ignore the per-player limits.
limits:
  ## Per player per day (server time). 0 = unlimited.
  max-opens-per-day: 0
  max-purchases-per-day: 0
  ## Hard cap for chests standing in the world at the same time.
  max-active-world-chests: 20

## ═══ WORLD CHEST ════════════════════════════════════════════════════════════
## A chest that stands in the world until somebody opens it.
world-chest:
  ## Seconds until an unopened chest disappears.
  ttl-seconds: 300
  hologram:
    enabled: true
    ## {tier} = coloured tier name.
    text: "{tier}"
    ## A second line under the name counts down the time left before the chest disappears.
    countdown: true
  ## What happens with chunk unload etc. is handled automatically (chest is removed).

## ═══ PROTECTION ═════════════════════════════════════════════════════════════
protection:
  prevent-break: true
  prevent-explosions: true
  prevent-pistons: true
  ## Obey WorldGuard & co.: placing is denied where other plugins cancel the click.
  respect-regions: true

## ═══ OPEN MODES ═════════════════════════════════════════════════════════════
roulette:
  ## SINGLE = the middle slot flips through items.
  ## SCROLL = a belt of items slides by (CS:GO style).
  ## RANDOM = SINGLE or SCROLL by coin flip for every spin.
  style: SCROLL
  ## Length of one spin in ticks (20 ticks = 1 second).
  ticks: 60
  ## Ticks to show a prize before the next spin when a tier has several rolls.
  pause-ticks: 14

full-chest:
  ## 3 = 27 slots, 6 = 54 slots. Anything left in the GUI is given back on close.
  rows: 3

pick:
  ## Face-down cards shown (max 27) and how many the player may pick.
  cards: 9
  picks: 1
  ## Ticks the revealed board stays open after the last pick.
  close-delay-ticks: 50

## ═══ LOOT ═══════════════════════════════════════════════════════════════════
loot:
  ## Weight given to items added with /mystic loot add when you don't type one.
  default-weight: 10
  ## Show drop chances in /mystic preview and the shop.
  show-chances: true
  ## Entries with a chance below this percent are "rare":
  ## they are announced (announce.on-rare) and counted by the pity system.
  rare-below-percent: 3
  ## Adding an identical item again adds its weight to the existing entry
  ## instead of creating a duplicate.
  merge-identical: true

## ═══ AUTOMATIC SPAWNING ═════════════════════════════════════════════════════
## Any number of profiles can run at the same time. Disable with "enabled: false".
##
## mode (where/how the chest appears):
##   RANDOM_WORLD - a random surface point around the world spawn
##   NEAR_PLAYER  - a random online player gets a chest nearby
##   FIXED_POINTS - one of the points set with /mystic point add <name>
##   AIRDROP      - the chest falls from the sky (location from airdrop.location)
##
## trigger:
##   type: INTERVAL  + minutes: N          - every N minutes
##   type: TIMES     + times: ["12:00"]    - at these server-clock times
##   type: ONLINE_THRESHOLD + players: 10 + cooldown-minutes: 60
##                                         - when 10+ players are online, at most once per hour
##
## announce: EXACT (coordinates) | REGION (rough area) | HINT (distance + direction) | NONE
spawn:
  profiles:
    main:
      enabled: true
      mode: RANDOM_WORLD
      trigger:
        type: INTERVAL
        minutes: 45
        ## Random +- spread so chests never come on a clock: 45 min +-30% = 31..58 minutes.
        jitter-percent: 30
      ## Spawn only while at least this many players are online.
      min-players: 1
      worlds: [world]
      ## Higher weight = more common. Unknown tiers are ignored.
      tier-weights:
        poor: 50
        solid: 30
        rich: 15
        elite: 5
      announce: EXACT
      ## Max chests of THIS profile standing at once.
      max-active: 3
      ## prefer-flat: percent of spawns that look for a CLEARING first (flat ground, no trees) - good for
      ## structures. The rest are fully random, and if no clearing is found the spawn falls back to any ground.
      prefer-flat: 70
      flat-tolerance: 1       # max height difference inside the checked area
      flat-radius: 3          # half-size of the checked area (blocks)
      random-world:
        radius: 1500
        min-distance-from-spawn: 50
        ## Ground blocks whose name contains one of these are rejected.
        avoid-ground: [WATER, LAVA, LEAVES, ICE, CACTUS, MAGMA, POWDER_SNOW]
    # Example: a chest next to a random player every 20 minutes.
    near_player:
      enabled: false
      mode: NEAR_PLAYER
      trigger: {type: INTERVAL, minutes: 20}
      min-players: 2
      worlds: [world]
      tier-weights: {poor: 70, solid: 30}
      announce: HINT
      max-active: 2
      near-player:
        min-distance: 40
        max-distance: 150
        ## Tell the chosen player privately.
        notify-player: true
    # Example: chests at hand-picked spots (/mystic point add spawn_plaza).
    points:
      enabled: false
      mode: FIXED_POINTS
      trigger: {type: TIMES, times: ["12:00", "20:00"]}
      worlds: [world]
      tier-weights: {rich: 70, elite: 30}
      announce: EXACT
      max-active: 2
      fixed-points:
        ## Only these points (empty list = all points).
        names: []
    # Example: an airdrop event twice a day.
    airdrop:
      enabled: false
      mode: AIRDROP
      trigger: {type: TIMES, times: ["15:00", "21:00"]}
      min-players: 3
      worlds: [world]
      tier-weights: {elite: 60, crusher: 40}
      announce: EXACT
      max-active: 1
      airdrop:
        ## Where it lands: RANDOM_WORLD or NEAR_PLAYER (uses the settings above).
        location: RANDOM_WORLD
        height: 60
        fall-seconds: 12
      random-world: {radius: 1000, min-distance-from-spawn: 100}

## ═══ EFFECTS ════════════════════════════════════════════════════════════════
## Per event: sound (XSeries name, works on every version), volume, pitch,
## particle (name or "" for none) + count, and title/subtitle/actionbar for the player.
## Placeholders: {player} {tier} {item}.  Leave a value empty to disable it.
effects:
  open:
    sound: BLOCK_CHEST_OPEN
    volume: 1.0
    pitch: 1.0
    particle: ""
    count: 0
  tick:
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.4
  win:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
    particle: HAPPY_VILLAGER
    count: 20
  rare:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
    particle: TOTEM_OF_UNDYING
    count: 40
    title: "&6&l★ RARE ★"
    subtitle: "&f{item}"
  spawn:
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 0.4
    pitch: 1.6
    particle: PORTAL
    count: 60
  ## Smoke puff when an unopened chest times out.
  expire:
    sound: ENTITY_GENERIC_EXTINGUISH_FIRE
    volume: 0.8
    pitch: 1.0
    particle: SMOKE
    count: 30

  ## ── Extra player effects, usable in any event above ────────────────────
  ##   potions:   ["SPEED:10:1", "NIGHT_VISION:20"]   NAME:seconds[:level]
  ##   lightning: true                                 harmless lightning flash at the player
  ##   firework:  true                                 firework burst in the tier colour
  ## Example:  rare:  {..., potions: ["GLOWING:10"], lightning: true}

  ## ── Aura around every STANDING world chest ─────────────────────────────
  ## style: RING (circle) | PILLAR (light column like a beacon) | SPIRAL (rising helix) | NONE
  ## Particles are tinted with the tier colour when the particle is DUST/REDSTONE (1.13+).
  ## One shared animation: it only runs while chests exist and only draws for players nearby.
  ## Per tier:  effects: {color: "#ff55ff", aura: {style: PILLAR, particle: DUST}}  in tiers.yml
  aura:
    enabled: true
    style: SPIRAL
    ## DUST (REDSTONE on old versions) can be coloured; END_ROD, FLAME ... keep their own look.
    particle: DUST
    ## Colour of DUST particles: TIER (the tier colour) | RANDOM (every particle a different colour) | RAINBOW (a moving rainbow).
    color-mode: RANDOM
    interval-ticks: 4
    height: 3.0
    radius: 0.9
    ## A soft chime near the chest so players can hear it. Empty = silent.
    sound: BLOCK_AMETHYST_BLOCK_CHIME
    volume: 0.4
    pitch: 1.2
    sound-interval-seconds: 6

  ## ── Lines: a particle cross (N, E, S, W) that leads to a standing chest ───────
  ## A light pulse runs along each line towards the chest. Step into a line and the particles around you
  ## change colour for "flash-seconds" - only you see it. Lines follow the ground and start outside the structure.
  ## length = how far they reach (blocks), step = distance between particles, color-mode as for the aura.
  lines:
    enabled: true
    length: 22
    step: 1.5
    interval-ticks: 5
    flash-seconds: 2
    particle: DUST
    color-mode: TIER

  ## ── Fireworks (instant, harmless) ────────────────────────────────────────── ───────────────────
  ## colors: RANDOM (2-3 random colours per burst) | TIER (the tier colour: first colour code of the name,
  ## or tiers.yml effects.color).   type: BALL | BALL_LARGE | STAR | BURST | CREEPER
  firework:
    colors: RANDOM
    on-rare: true
    on-spawn: true
    type: BALL_LARGE
    count: 1
    flicker: true
    trail: true

## ═══ STRUCTURES ═══════════════════════════════════════════════════════════
## Chests can appear inside a small building: a stepped pyramid with a golden cap, an open temple,
## an obelisk, a ring of standing stones, or a gate. It is built layer by layer in front of the players
## (that is the show), the chest waits at the top / on the altar, and when the chest is opened or times
## out the building collapses after a short delay and the ORIGINAL terrain is put back.
## Terrain is saved to data/structures/ while a structure stands, so even a server crash is undone on the next start.
##
## Which structures are in the rotation, with weights, is edited in game: /mystic structure edit
## (stored in structures.yml). Besides the five built-in shapes (pyramid, temple, obelisk, henge, gate)
## you can build and SAVE YOUR OWN: get the wand with /mystic structure wand, select the building with
## left/right click, put a chest where the loot chest should appear, then /mystic structure save <name>.
## Saved structures keep their exact blocks, are rotated randomly (rotate: true) and leave the terrain
## around them untouched.
## theme:  AUTO (from the biome) | DESERT | STONE | NETHER | END | FROST | OCEAN
## chance: percent of spawns that get a structure (the rest are a plain chest)
## decay:  0..1  how "ancient" it looks: chance that decorative blocks are missing
## Sites that are steep, in water or contain player-made blocks (chests, doors, beds, signs...) are skipped
## and the chest simply appears without a structure.
## Override per spawn profile  (structure: {chance: 100, shapes: [PYRAMID]})  and per tier in tiers.yml
##   (structure: {shape: gate, theme: END}).   shape/shapes take names from /mystic structure list.  Try it by hand:  /mystic spawn rich here pyramid desert
structures:
  enabled: true
  chance: 70
  ## AUTO = the biome's theme, but "theme-surprise-percent" of the time a random one;  RANDOM = always random.
  theme: AUTO
  theme-surprise-percent: 35
  ## Blend into the landscape: where the ground next to the building is lower than its floor, earth is filled
  ## in (grass on top) and slopes down away from it, so the building sits IN the terrain instead of hovering.
  blend:
    enabled: true
    width: 3
  ## Rubble scattered around the structure: rocks, clusters, toppled columns, broken stubs, now and then a piece
  ## of an arch. It appears from the building outwards. Everything goes away with the structure unless
  ## keep-after-collapse is true (then the ruins stay forever). Per spawn the amount varies by +-40%.
  ##   radius: how far it spreads (blocks)      pieces: how many pieces on average
  ##   load-chunks: load and hold the chunks of the whole field (needed for a full 30-block field when nobody is near)
  ## Per profile/tier:  structure: {debris: {enabled: false}}   or   {debris: {radius: 40, pieces: 80}}
  debris:
    enabled: true
    radius: 30
    pieces: 45
    load-chunks: true
    keep-after-collapse: false
  ## Random 90 degree turn of your own saved structures.
  rotate: true
  decay: 0.08
  ## Blocks placed per tick while building (40 = about 1-2 seconds for a pyramid).
  build-speed: 40
  ## Collapse top-down instead of vanishing at once; delay before it starts after the chest is gone.
  collapse: true
  collapse-delay-seconds: 20
  ## Players cannot break the structure or blast it with TNT while it stands.
  protect: true
  ## Highest allowed height difference of the ground under the structure.
  max-slope: 4
  sound: BLOCK_STONE_PLACE

## ═══ HUNT (be the first) ═══════════════════════════════════════════════════
## Open a world chest within "window-seconds" of its appearance and you get a hunter's bonus:
## extra rolls, optional commands, an announcement and a point in the "hunts" leaderboard.
## Every key can be overridden per tier (tiers.yml  hunt: {window-seconds: 60, bonus-rolls: 3}).
hunt:
  enabled: true
  window-seconds: 120
  bonus-rolls: 1
  ## Console commands for the hunter, {player} is replaced:  ["eco give {player} 100"]
  commands: []
  announce: true

## ═══ GUARDS ═════════════════════════════════════════════════════════════════
## Mobs that stand guard around a chest. A spawned chest gets guards with "chance" percent.
## Each guard level below is a recipe: mobs (type, count, name, health, helmet, chestplate, leggings,
## boots, weapon, effects) and optionally a BOSS with a boss bar and commands for whoever kills it.
## A tier picks its own chance and level weights (tiers.yml):
##   guards: {chance: 80, levels: {veteran: 40, boss: 60}}
## Make your own levels - any name works, any number of them.
## effects: ["SPEED:99999:1"]  NAME:seconds:level.  Gear never drops; rewards come from the chest and "commands".
guards:
  enabled: true
  chance: 20
  ## The chest cannot be opened until the guards are dead.
  lock-chest: true
  ## Guards spawn up to this far from the chest and are pulled back when they stray beyond "leash".
  radius: 7
  leash: 20
  announce: true
  levels:
    patrol:
      weight: 60
      name: "&7Patrol"
      mobs:
        - {type: ZOMBIE, count: 3, name: "&7Mystic Guard", health: 24, helmet: IRON_HELMET, weapon: IRON_SWORD}
    veteran:
      weight: 30
      name: "&6Veterans"
      mobs:
        - {type: SKELETON, count: 3, name: "&6Mystic Archer", health: 30, helmet: CHAINMAIL_HELMET, weapon: BOW}
        - {type: ZOMBIE, count: 2, name: "&6Mystic Knight", health: 40, helmet: DIAMOND_HELMET, chestplate: IRON_CHESTPLATE, weapon: IRON_SWORD, effects: ["SPEED:99999:0"]}
    boss:
      weight: 10
      name: "&c&lBoss encounter"
      mobs:
        - {type: SKELETON, count: 3, name: "&cBoss minion", health: 30, weapon: BOW}
      boss:
        type: WITHER_SKELETON
        name: "&4&lKeeper of the Chest"
        health: 150
        helmet: DIAMOND_HELMET
        weapon: DIAMOND_SWORD
        effects: ["DAMAGE_RESISTANCE:99999:0", "SPEED:99999:1"]
        bossbar: {color: RED, style: SEGMENTED_10}
        commands: []

## ═══ ATMOSPHERE (a mood around the chest) ═══════════════════════════════════
## While a chest stands, players near it can get their OWN sky: a different time of day, rain/storm and
## harmless lightning flashes. Only players within "radius" see it; the rest of the world is untouched and
## leaving the radius brings the normal sky back at once. Off by default - tiers opt in:
##   tiers.yml:  atmosphere: {enabled: true, time: MIDNIGHT, weather: STORM, radius: 45}
## time: DAWN | NOON | DUSK | NIGHT | MIDNIGHT | 0-24000 | NONE     weather: CLEAR | RAIN | STORM | NONE
atmosphere:
  enabled: false
  radius: 40
  time: MIDNIGHT
  weather: STORM
  ## Seconds between lightning flashes near the chest (0 = none), and how far from the chest they land.
  lightning-interval-seconds: 9
  lightning-radius: 10
  ## A sound for players in the zone, e.g. AMBIENT_CAVE. Empty = none.
  ambient-sound: ""
  ambient-interval-seconds: 12

## ═══ CAPTURE (duel for the chest) ═══════════════════════════════════════════
## With other players around, opening a chest starts a CAPTURE: a boss bar fills while the capturer stands in
## the zone alone. Any enemy inside the zone drains it; if the capturer dies or leaves it fails and anybody can
## start again. Alone, a player simply opens the chest (unless trigger: ALWAYS). Players in the same scoreboard
## team never contest each other. Off by default - per tier:  duel: {enabled: true, capture-seconds: 15}
duel:
  enabled: false
  trigger: WHEN_CONTESTED     # WHEN_CONTESTED | ALWAYS
  capture-seconds: 10
  zone-radius: 5
  detect-radius: 16           # "other players are around" and who sees the bar
  decay-per-second: 2.0       # how fast an enemy in the zone drains the progress

## ═══ LEADERBOARD, STATS & ACHIEVEMENTS ═════════════════════════════════════
## Counted per player: opens, rares, hunts (first openers), guards, bosses, captures.
## /mystic top [stat] [all]   /mystic stats   holograms: /mystic board create <name> <stat> [all]
## At the end of every period the top players of "reward-stat" get the commands below
## ({player}, {rank}, {value}, {stat}). Leave rewards empty for no payout.
leaderboard:
  enabled: true
  period: WEEKLY              # DAILY | WEEKLY | MONTHLY | ALL (never resets)
  top-size: 10
  board-lines: 5
  reward-stat: opens
  announce-winners: true
  rewards: {}
  # rewards:
  #   1: ["points give {player} 500"]
  #   2: ["points give {player} 300"]
  #   3: ["points give {player} 100"]

## One entry per achievement: stat + threshold (all-time). title/subtitle can be a string or {en: .., ru: ..}.
## announce: true tells everybody. commands: console commands for the player.
achievements:
  first_open:
    stat: opens
    at: 1
    title: {en: "&6First mystic!", ru: "&6Первый мистик!"}
    subtitle: {en: "&7You opened your first chest", ru: "&7Вы открыли первый сундук"}
  veteran:
    stat: opens
    at: 50
    title: {en: "&bMystic veteran", ru: "&bВетеран мистиков"}
    subtitle: {en: "&750 chests opened", ru: "&7Открыто 50 сундуков"}
    announce: true
  lucky:
    stat: rares
    at: 5
    title: {en: "&dLucky one", ru: "&dСчастливчик"}
    subtitle: {en: "&75 rare rewards", ru: "&75 редких наград"}
  fast_hands:
    stat: hunts
    at: 10
    title: {en: "&eFast hands", ru: "&eБыстрые руки"}
    subtitle: {en: "&710 chests opened first", ru: "&710 сундуков открыто первым"}
  guard_slayer:
    stat: guards
    at: 25
    title: {en: "&cGuard slayer", ru: "&cУбийца стражей"}
    subtitle: {en: "&725 guards defeated", ru: "&7Побеждено 25 стражей"}
  boss_slayer:
    stat: bosses
    at: 1
    title: {en: "&4Boss slayer", ru: "&4Убийца босса"}
    subtitle: {en: "&7You defeated a chest boss", ru: "&7Вы победили босса сундука"}
    announce: true
  conqueror:
    stat: captures
    at: 3
    title: {en: "&5Conqueror", ru: "&5Завоеватель"}
    subtitle: {en: "&73 chests captured", ru: "&7Захвачено 3 сундука"}

## ═══ CHEST COMPASS ══════════════════════════════════════════════════════════
## /mystic compass gives an item; right click points it at the nearest standing chest.
compass:
  enabled: true
  cooldown-seconds: 3

## ═══ ANNOUNCEMENTS ══════════════════════════════════════════════════════════
## type:   CHAT | TITLE | ACTIONBAR | NONE
## radius: only players within N blocks hear it (-1 = everyone)
## world-only: only players in the same world
announce:
  on-spawn:
    type: CHAT
    radius: -1
    world-only: false
    ## Played to EVERY recipient (not positional), so everybody notices. Empty = silent.
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.2
  on-open:
    type: CHAT
    radius: -1
    world-only: false
  on-rare:
    type: CHAT
    radius: -1
    world-only: false
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    pitch: 1.0

## PlaceholderAPI (if installed) gets %mysticchest_cooldown_<tier>%, %mysticchest_cooldown_formatted_<tier>%,
## %mysticchest_opens_today%, %mysticchest_pity_<tier>% and %mysticchest_active_chests%.

## ═══ BOSS BAR ═════════════════════════════════════════════════════════════
## One boss bar per standing chest: tier, time left, coordinates and open type. It drains as the time
## runs out. viewers: ALL | WORLD (players in the chest's world) | RADIUS (within "radius" blocks).
## color: AUTO (tier colour) or PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE.  style: SOLID, SEGMENTED_6/10/12/20.
## The text is in lang/<language>.yml (bossbar.title), in the server language.
bossbar:
  enabled: true
  viewers: WORLD
  radius: 500
  color: AUTO
  style: SOLID

## ═══ RANDOM OPEN MODE ═════════════════════════════════════════════════════
## Set  open-mode: RANDOM  (here as default-open-mode, or in a tier) and every chest opens in a random way:
## roulette, full chest, mystery cards or instantly, with these weights.
## reveal-at-spawn: true  - the way is rolled when the chest appears and announced ("Type: mystery cards");
##                  false - rolled when somebody opens it (announced as "random").
random-mode:
  reveal-at-spawn: true
  weights:
    ROULETTE: 40
    FULL_CHEST: 25
    PICK: 25
    INSTANT: 10

## ═══ GUI ════════════════════════════════════════════════════════════════════
gui:
  ## Right click a chest in the shop to preview its loot.
  preview-enabled: true
  ## Material for empty slots in editors/previews (XSeries name).
  filler: GRAY_STAINED_GLASS_PANE

## ═══ PERFORMANCE ════════════════════════════════════════════════════════════
## The plugin is built to cost ~0 when idle. These knobs are for huge servers.
## Check live numbers with  /mystic perf
performance:
  ## Write files on a background thread (recommended).
  async-io: true
  ## Files are saved at most once per this many seconds (debounce).
  save-interval-seconds: 5
  ## Keep ready-made GUI items instead of rebuilding them on each open.
  gui-cache: true
  ## Cap on simultaneously running roulette/pick/airdrop animations.
  max-concurrent-animations: 100
  ## Players farther than this (blocks) don't receive particles.
  effects-view-distance: 32
  ## Hard cap for particles per effect.
  particle-limit: 60
  ## true = no particles, no holograms (weakest servers).
  low-resource: false
