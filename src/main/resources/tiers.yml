##############################################################################
##                          MysticChest  -  tiers.yml                         ##
##############################################################################
## One block per chest tier. The block name (poor, solid, ...) is the tier id
## used in commands:  /mystic give Steve rich
## Rewards are NOT here - they live in loot/<tier-id>.yml and are edited in game with
## /mystic loot edit <tier>.
##
## Every key except name/price is optional; missing ones fall back to config.yml.
##
##   name:         display name. A plain string, or one string per language:
##                 name: {en: "&6Rich chest", ru: "&6Богатый сундук"}
##   icon:         material shown in the shop (default CHEST)
##   price:        cost in the tier currency
##   currency:     Vault ignores it. ExcellentEconomy: the currency id (gold, tokens...)
##   purchasable:  false = can only be given/spawned, never bought
##   rolls:        how many rewards one opening gives. Number, or {min: 2, max: 4}
##   open-mode:    ROULETTE | FULL_CHEST | INSTANT | PICK  (overrides default-open-mode)
##   ttl-seconds:  how long a world chest of this tier waits to be opened
##   cooldowns:    {open-seconds, buy-seconds, claim-seconds}  (overrides config.yml)
##   limits:       {max-opens-per-day, max-purchases-per-day}
##   pity:         {after: 10}  - after 10 openings without a rare reward the next one is guaranteed rare
##   hologram:     text above a world chest of this tier
##   structure:    {shape: GATE, theme: END, chance: 100, enabled: true}  - the building around this tier's chests
##   hunt:         {window-seconds: 60, bonus-rolls: 3}       - bonus for the first opener
##   guards:       {chance: 80, levels: {veteran: 40, boss: 60}}  - mobs around the chest (levels: config.yml)
##   atmosphere:   {enabled: true, time: MIDNIGHT, weather: STORM, radius: 45}  - a mood only near the chest
##   duel:         {enabled: true, capture-seconds: 15}       - fight for the chest when others are near
##   activation:   {seconds: 240} or {enabled: false} - the chest sleeps this long after it appears (hologram counts down); config.yml: activation
##   effects:      {color: "#ff55ff", aura: {style: PILLAR, particle: DUST}}
##                 tier colour for aura/fireworks (default: first colour code of the name)
## ═══════════════════════════════════════════════════════════════════════════
tiers:
  poor:
    name: {en: "&7Poor chest", ru: "&7Бедный сундук"}
    price: 10000000
    currency: gold
    rolls: 3
    activation: {seconds: 60}
    # open-mode: INSTANT
    # cooldowns: {open-seconds: 60}

  solid:
    name: {en: "&aSolid chest", ru: "&aСолидный сундук"}
    price: 25000000
    currency: gold
    rolls: {min: 3, max: 5}
    activation: {seconds: 90}

  rich:
    name: {en: "&6Rich chest", ru: "&6Богатый сундук"}
    price: 60000000
    currency: gold
    rolls: 5
    activation: {seconds: 150}
    pity: {after: 15}

  elite:
    name: {en: "&dElite chest", ru: "&dЭлитный сундук"}
    price: 150000000
    currency: gold
    rolls: 6
    activation: {seconds: 240}
    open-mode: PICK
    pity: {after: 10}
    hunt: {window-seconds: 90, bonus-rolls: 2}
    guards: {chance: 60, levels: {veteran: 70, boss: 30}}
    atmosphere: {enabled: true, time: MIDNIGHT, weather: STORM, radius: 45}
    duel: {enabled: true, capture-seconds: 12}

  crusher:
    name: {en: "&cCrusher chest", ru: "&cСундук Крушителя"}
    price: 16500
    currency: tokens
    rolls: 6
    activation: {seconds: 300}
    open-mode: FULL_CHEST
    icon: ENDER_CHEST
    guards: {chance: 100, levels: {boss: 100}}
    atmosphere: {enabled: true, time: DUSK, weather: RAIN, radius: 40, lightning-interval-seconds: 14}
    duel: {enabled: true, capture-seconds: 15}

  admin:
    name: {en: "&4Admin chest", ru: "&4Сундук Админа"}
    purchasable: false
    rolls: 8
    activation: {enabled: false}
    open-mode: FULL_CHEST

  aristocratic:
    name: {en: "&5&lAristocratic chest", ru: "&5&lАристократический сундук"}
    purchasable: false
    rolls: 10
    activation: {seconds: 300}
    open-mode: FULL_CHEST

  death:
    name: {en: "&4&lDeath chest", ru: "&4&lСундук смерти"}
    purchasable: false
    rolls: 7
    activation: {seconds: 420}
    icon: ENDER_CHEST
    open-mode: VOLCANO
    ttl-seconds: 900
    guards: {chance: 0}
    deathzone: {enabled: true, radius: 25, drop-rolls: 1}
    duel: {enabled: true, trigger: ALWAYS, capture-seconds: 20, zone-radius: 6}
    atmosphere: {enabled: true, time: MIDNIGHT, weather: STORM, radius: 40, lightning-interval-seconds: 6}
