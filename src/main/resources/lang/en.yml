  removed: "&aPoint &e{name} &aremoved."
  unknown: "&cNo such point: &e{name}"

## ═══ loot commands ═══
loot:
  added: "&aAdded &e{count} &astack(s) to &r{tier} &7(weight {weight})"
  nothing: "&cNothing to add - your inventory is empty."
  added-cmd: "&aAdded a command reward to &r{tier} &7(weight {weight}). Add the command text with /mystic loot cmd."
  weight-set: "&aEntry &e#{n} &anow has weight &e{weight}&a."
  removed: "&aRemoved entry &e#{n} &afrom &r{tier}&a."
  list-header: "&5Rewards of &r{tier} &7({count})"
  list-line: "&e#{n} &f{item} &7x{amount} &8| &7weight {weight} ({chance}%) &8| &7commands: {cmds}"
  clear-confirm: "&cThis deletes ALL rewards of &r{tier}&c. Repeat with &e confirm &cat the end."
  cleared: "&aAll rewards of &r{tier} &awere removed."
  no-commands: "&7This entry has no commands."
  cmd-line: "&e{n}. &7[{run}, {chance}%] &f{command}"
  cmd-added: "&aCommand added to entry &e#{n}&a."
  cmd-removed: "&aCommand &e{n} &aremoved."
  cmd-cleared: "&aAll commands of entry &e#{n} &aremoved."
  bad-index: "&cNo entry #{n} in this tier. See /mystic loot list <tier>."

prompt:
  commands:
    - "&5&lType the command in chat &7(without /)"
    - "&7Prefix &fp: &7to run it as the player, &f50% &7for a chance."
    - "&7Examples: &fgive {player} diamond 1 &7| &fp: spawn &7| &f25% kit vip {player}"
    - "&7Also: &f-2 &7removes command 2, &fclear &7removes all, &fcancel &7aborts."
  timeout: "&7Input timed out."

## ═══ GUI texts ═══
gui:
  prev: "&e◀ Previous page"
  next: "&eNext page ▶"
  back: "&cBack to shop"
  close: "&cClose"
  roulette:
    title: "&5Mystic chest"
  chest:
    title: "&5Loot: {tier}"
  pick:
    title: "&5Pick {picks} card(s)"
    card: "&d? Mystery card"
    card-lore:
      - "&7Click to reveal"
    missed: "&8(missed)"
  shop:
    title: "&5Mystic chest shop"
    price: "&7Price: &e{price} {currency}"
    cooldown: "&7Purchase cooldown: &e{time}"
    lore:
      - ""
      - "&aClick to buy"
    lore-preview:
      - ""
      - "&aLeft click: &fbuy"
      - "&eRight click: &fpreview rewards"
  preview:
    title: "&5Rewards: {tier}"
    chance: "&7Chance: &e{chance}%"
    amount: "&7Amount: &f{min}-{max}"
    rare: "&6★ Rare"
  editor:
    title: "&5Edit loot: {tier}"
    add-inventory: "&aAdd my whole inventory"
    add-inventory-lore:
      - "&7Moves every item from your inventory"
      - "&7into this tier's rewards."
    add-hand: "&aAdd item in hand"
    add-hand-lore:
      - "&7Moves only the held item."
    info: "&eEntries: {entries}"
    info-lore:
      - "&7Page {page}/{pages}"
      - ""
      - "&7Drop an item on the window"
      - "&7or shift-click it in your inventory"
      - "&7to add it as a reward."
    next-tier: "&bSwitch tier"
    line:
      weight: "&7Weight: &e{weight} &7(&e{chance}%&7)"
      amount: "&7Amount: &f{amount}"
      gives: "&7Gives the item"
      no-item: "&cOnly runs commands (no item)"
      broadcast: "&6Announced to everyone"
      commands: "&7Commands:"
      cmd: "&8 {n}. [{run} {chance}%] &f{command}"
    help:
      - "&8Left/Right click: &7weight +1 / -1"
      - "&8Shift + click: &7weight +10 / -10"
      - "&8F: &7edit commands  &8Key 1: &7announce"
      - "&8Key 2: &7give item on/off"
      - "&8Q: &7delete (press twice)"
    help-armed:
      - "&c&lPress Q again to delete #{n}"

## ═══ /mystic perf ═══
perf:
