##############################################################################
##                      MysticChest  -  lang/en.yml                           ##
##############################################################################
## All player-visible texts. Colours: &a &l ... and &#RRGGBB (1.16+).
## {placeholders} are filled in by the plugin - keep them as they are.
## Missing keys fall back to the built-in English text, so you may delete lines you don't change.
## To add a language: copy this file to lang/<code>.yml and set  language: <code>  in config.yml.

prefix: "&5[Mystic] &r"

## ═══ time units (used in "{time}") ═══
time:
  d: "d"
  h: "h"
  m: "m"
  s: "s"

## ═══ errors / denials ═══
deny:
  no-permission: "&cYou don't have permission."
  cooldown: "&cWait &e{time} &cbefore opening this chest again."
  buy-cooldown: "&cWait &e{time} &cbefore buying this chest again."
  limit-opens: "&cDaily limit reached: &e{max} &cchests per day."
  limit-buys: "&cDaily purchase limit reached: &e{max}&c."
  no-loot: "&cThis chest has no rewards configured."
  cannot-place: "&cYou can't place a chest here."
  claimed: "&cThis chest belongs to another player for &e{time}&c."
only-players: "&cThis command is for players."
unknown-tier: "&cUnknown chest tier: &e{tier}"
unknown-player: "&cPlayer not found: &e{player}"
unknown-profile: "&cUnknown spawn profile: &e{profile}"
reloaded: "&aConfiguration reloaded."
given: "&aGave &e{count}x &r{tier} &ato &f{player}&a."

## ═══ usage ═══
usage:
  root: "&eUse &f/mystic help"
  give: "&e/mystic give <player> <tier> [amount]"
  spawn: "&e/mystic spawn <tier> [here|<profile>] [shape] [theme]"
  preview: "&e/mystic preview <tier>"
  point: "&e/mystic point <add <name>|remove <name>|list>"
  loot: "&e/mystic loot <add|addcmd|cmd|weight|remove|list|edit|clear> <tier> ..."
  loot-add: "&e/mystic loot add <tier> [weight] [--keep] [--hand]"
  loot-addcmd: "&e/mystic loot addcmd <tier> <weight> <command...>"
  loot-cmd: "&e/mystic loot cmd <tier> <#> <add [player:] [50%] <command>|remove <n>|list|clear>"
  loot-weight: "&e/mystic loot weight <tier> <#> <weight>"

help:
  player:
    - "&5&lMystic chests &8- &7click a command"
    - "[[&e/mystic shop|run:/mystic shop|&7Open the shop]] &7- buy chests"
    - "[[&e/mystic chests|run:/mystic chests|&7Standing chests and timers]] &7- where are they?"
    - "[[&e/mystic track|run:/mystic track|&7Arrow to the nearest chest]] &7- arrow to the nearest"
    - "[[&e/mystic top|run:/mystic top|&7Leaderboard]] &7- leaderboard, [[&e/mystic stats|run:/mystic stats|&7Your numbers]] &7- yours"
    - "[[&e/mystic compass|run:/mystic compass|&7Get a chest compass]] &7- compass, [[&e/mystic mute|run:/mystic mute|&7Toggle announcements]] &7- mute"
    - "[[&e/mystic list|run:/mystic list|&7All tiers]] &7- tiers (click a tier to preview)"
  admin:
    - "&5&lMystic chests &7(admin) &8- &7click a command"
    - "[[&e/mystic shop|run:/mystic shop]], [[&e/mystic list|run:/mystic list]], [[&e/mystic chests|run:/mystic chests]], [[&e/mystic top|run:/mystic top]], [[&e/mystic perf|run:/mystic perf]]"
    - "[[&e/mystic give <player> <tier> [n]|suggest:/mystic give |&7Give chest items]]"
    - "[[&e/mystic spawn <tier> [here|profile] [shape] [theme]|suggest:/mystic spawn |&7Place / run a profile]]"
    - "[[&e/mystic loot ...|suggest:/mystic loot |&7add, addcmd, cmd, weight, remove, list, edit, clear]] &7- your inventory into rewards"
    - "[[&e/mystic structure ...|suggest:/mystic structure |&7wand, pos1, pos2, save, edit, preview, list, delete, export, import]]"
    - "[[&e/mystic debug|run:/mystic debug|&7Why chests do or do not spawn]]"
    - "[[&e/mystic point|suggest:/mystic point |&7add, remove, list]], [[&e/mystic board|suggest:/mystic board |&7create, remove, list]], [[&e/mystic economy|run:/mystic economy]], [[&e/mystic reload|run:/mystic reload]]"

shop:
  economy-disabled: "&cNo economy is connected - purchases are disabled."
  not-enough: "&cNot enough funds! You need &e{price} {currency}&c."
  bought: "&aYou bought &r{tier}&a."

world:
  placed: "&aYou placed &r{tier}&a. Right click it to open!"

## ═══ chest item ═══
item:
  lore:
    - "&7Right click to open"

