  expired: "&7A mystic chest &r{tier}&7 disappeared."
  opened: "&e{player} &fopened &r{tier} &7({mode})&f!"
  rare: "&6★ &e{player} &fwon &e{amount}x {item} &ffrom &r{tier}&f!"

dir:
  e: "east"
  se: "south-east"
  s: "south"
  sw: "south-west"
  w: "west"
  nw: "north-west"
  n: "north"
  ne: "north-east"

spawn:
  failed: "&cCould not find a place for the chest."
  near-you: "&dA mystic chest appeared near you! Look around!"

point:
  none: "&7No fixed points yet. Use &e/mystic point add <name>"
