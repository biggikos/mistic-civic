    - "[[&e/mystic spawn <тир> [here|профиль] [форма] [тема]|suggest:/mystic spawn |&7Поставить / запустить профиль]]"
    - "[[&e/mystic loot ...|suggest:/mystic loot |&7add, addcmd, cmd, weight, remove, list, edit, clear]] &7- инвентарь в награды"
    - "[[&e/mystic structure ...|suggest:/mystic structure |&7wand, pos1, pos2, save, edit, preview, list, delete, export, import]]"
    - "[[&e/mystic debug|run:/mystic debug|&7Почему сундуки спавнятся или нет]]"
