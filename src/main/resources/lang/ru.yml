## Все тексты, которые видят игроки. Цвета: &a &l ... и &#RRGGBB (1.16+).
## {плейсхолдеры} подставляет плагин - оставляйте их как есть.
## Недостающие ключи берутся из встроенного текста, можно удалять неизменённые строки.
## Свой язык: скопируйте файл в lang/<код>.yml и укажите  language: <код>  в config.yml.

prefix: "&5[Мистик] &r"

time:
  d: "д"
  h: "ч"
  m: "м"
  s: "с"

deny:
  no-permission: "&cУ вас нет прав."
  cooldown: "&cПодождите &e{time}&c, прежде чем снова открыть этот сундук."
  buy-cooldown: "&cПодождите &e{time}&c, прежде чем снова купить этот сундук."
  limit-opens: "&cДневной лимит исчерпан: &e{max} &cсундуков в день."
  limit-buys: "&cДневной лимит покупок исчерпан: &e{max}&c."
  no-loot: "&cУ этого сундука не настроены награды."
  cannot-place: "&cЗдесь нельзя поставить сундук."
  claimed: "&cЭтот сундук принадлежит другому игроку ещё &e{time}&c."
only-players: "&cЭта команда только для игроков."
unknown-tier: "&cТакого сундука нет: &e{tier}"
