reloaded: "&aКонфигурация перезагружена."
given: "&aВыдано &e{count}x &r{tier} &aигроку &f{player}&a."

usage:
  root: "&eИспользуйте &f/mystic help"
  give: "&e/mystic give <игрок> <тир> [кол-во]"
  spawn: "&e/mystic spawn <тир> [here|<профиль>]"
  preview: "&e/mystic preview <тир>"
  point: "&e/mystic point <add <имя>|remove <имя>|list>"
  loot: "&e/mystic loot <add|addcmd|cmd|weight|remove|list|edit|clear> <тир> ..."
  loot-add: "&e/mystic loot add <тир> [вес] [--keep] [--hand]"
  loot-addcmd: "&e/mystic loot addcmd <тир> <вес> <команда...>"
  loot-cmd: "&e/mystic loot cmd <тир> <#> <add [player:] [50%] <команда>|remove <n>|list|clear>"
  loot-weight: "&e/mystic loot weight <тир> <#> <вес>"

