name: MysticChest
version: ${version}
main: ru.mysticchest.MysticChestPlugin
api-version: 1.13
authors: [Biggiko]
description: Mystic chests with roulette, structures, guards, events and an in-game loot editor
website: https://github.com/biggikos/mistic-civic
softdepend: [Vault, ExcellentEconomy, PlaceholderAPI]
commands:
  mystic:
    description: Mystic chests
    aliases: [mc, mistic]
    usage: /mystic help
permissions:
  mysticchest.use:
    description: Open mystic chests
    default: true
  mysticchest.shop:
    description: Use /mystic shop
    default: true
  mysticchest.preview:
    description: Use /mystic preview
    default: true
  mysticchest.compass:
    description: Get and use the chest compass
    default: true
  mysticchest.chests:
    description: /mystic chests (timers of standing chests)
    default: true
  mysticchest.chests.coords:
    description: See exact coordinates in /mystic chests
    default: op
  mysticchest.top:
    description: /mystic top and /mystic stats
    default: true
  mysticchest.admin.structure:
    description: Save, edit, preview and delete structures
    default: op
  mysticchest.admin:
    description: give, spawn, reload, perf, point
    default: op
  mysticchest.admin.loot:
    description: Edit chest rewards (/mystic loot, editor GUI)
    default: op
  mysticchest.bypass.cooldown:
    description: Ignore chest cooldowns and claim locks
    default: false
  mysticchest.bypass.limits:
    description: Ignore daily limits
    default: false
