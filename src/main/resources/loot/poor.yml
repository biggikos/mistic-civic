##############################################################################
## Rewards of tier "poor".  Edit in game:  /mystic loot edit poor
## This file is REWRITTEN (comments are lost) when you change loot in game.
##
## entry keys:
##   material: item name (works on every version)   | item: <full serialized item>
##   amount: N  or  min/max: random amount          weight: bigger = more common
##   give-item: false = only run commands (the item is just the icon)
##   commands: ["kit x {player}", {run: PLAYER, command: "spawn", chance: 50}]
##   broadcast: true = announce when someone wins it
##   permission: only players with it can win this entry
##   limit-per-player: N = one player can win this entry at most N times
##############################################################################
entries:
